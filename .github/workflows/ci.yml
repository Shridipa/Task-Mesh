name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ambient values the test suite must ignore: `conftest.py` forces its own
  # test-only auth configuration, so a mismatch here is a test failure, not a
  # silently weaker or broken suite. Never valid outside CI.
  WORKER_SECRET: ci-worker-secret
  AUTH_JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
  AUTH_API_KEYS: ci-admin-key:admin:default,ci-developer-key:developer:default,ci-viewer-key:viewer:default
  CORS_ORIGINS: http://localhost:5173

jobs:
  backend:
    name: backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: pytest --cov=taskmesh --cov-report=term-missing --cov-fail-under=80

  postgres:
    name: backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskmesh
          POSTGRES_PASSWORD: taskmesh
          POSTGRES_DB: taskmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://taskmesh:taskmesh@localhost:5432/taskmesh
      TEST_DATABASE_URL: postgresql+asyncpg://taskmesh:taskmesh@localhost:5432/taskmesh
      # Alembic and the test client talk to the same database.
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check migrations match the models
        run: alembic check
      - name: Test against PostgreSQL
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Production build
        run: npm run build

  infrastructure:
    name: docker
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        env:
          POSTGRES_PASSWORD: ci-compose-password
          AUTH_JWT_SECRET: ci-compose-jwt-secret-0123456789abcdef
          AUTH_API_KEYS: ci-compose-admin:admin:default
          WORKER_SECRET: ci-compose-worker-secret
          GF_SECURITY_ADMIN_PASSWORD: ci-compose-grafana-password
        run: docker compose config --quiet
      - name: Build API image
        run: docker build -t taskmesh-api:ci .
      - name: Build frontend image
        run: docker build -t taskmesh-frontend:ci ./frontend

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        # Advisories in transitive upstream packages should be visible without
        # blocking unrelated fixes; the report stays in the workflow summary.
        continue-on-error: true
        run: pip-audit --desc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm dependencies
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
