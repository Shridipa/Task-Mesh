[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmesh"
version = "0.1.0"
description = "Distributed task processing platform with queues, retries, DLQ, rate limiting, and worker scaling."
requires-python = ">=3.10" 
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "prometheus-client>=0.20",
  "SQLAlchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "psycopg2-binary>=2.9",
  "PyJWT>=2.8",
  "redis>=5.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# An explicit rule set keeps `ruff check` identical locally and in CI whatever
# version of Ruff is installed (newer versions expand their defaults).
select = [
  "E4",   # import problems
  "E7",   # statements that are not useful
  "E9",   # runtime errors
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "S",    # bandit-style security checks
  "BLE",  # blind except
  "G",    # logging format
  "C4",   # comprehensions
  "DTZ",  # timezone-aware datetimes
  "PIE",  # misc lint
  "RET",  # return statements
  "PYI",  # stub-file consistency (applies to typed methods in tests too)
  "EXE",  # executables
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies through call defaults; that is the framework's
# documented interface, not an accidental mutable default.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design and use obviously fake credentials.
"tests/**" = ["S101", "S105", "S106", "S311"]
"conftest.py" = ["S101", "S105", "S106"]
# The smoke script talks to an explicitly configured API base URL.
"scripts/*.py" = ["S310"]
# Alembic must extend sys.path before importing the project package.
"alembic/env.py" = ["E402"]
