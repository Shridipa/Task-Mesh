# TaskMesh production-like stack.
#
#   cp .env.example .env    # then edit the secrets
#   docker compose up -d --build
#   docker compose ps       # api, worker, scheduler, postgres, redis, frontend
#
# The API, worker and scheduler share one image and one database. PostgreSQL and
# Redis are reachable only on the internal network; the frontend (nginx) is the
# only service published by default.

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-env: &app-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskmesh}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-taskmesh}
  REDIS_URL: redis://redis:6379/0
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  WORKER_SECRET: ${WORKER_SECRET:?set WORKER_SECRET in .env}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env (32+ characters)}
  AUTH_API_KEYS: ${AUTH_API_KEYS:?set AUTH_API_KEYS in .env (key:role:tenant,...)}
  AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  AUTO_CREATE_SCHEMA: "false"
  METRICS_PUBLIC: ${METRICS_PUBLIC:-true}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
  RATE_LIMIT_SUBMISSIONS: ${RATE_LIMIT_SUBMISSIONS:-10}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-taskmesh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmesh} -d ${POSTGRES_DB:-taskmesh}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build: *app-build
    image: taskmesh/app:local
    environment:
      <<: *app-env
      # Dedicated worker/scheduler containers run the background loops.
      EMBEDDED_WORKER: "false"
      EMBEDDED_SCHEDULER: "false"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s

  worker:
    build: *app-build
    image: taskmesh/app:local
    environment:
      <<: *app-env
      WORKER_HEALTH_FILE: /tmp/worker-alive
    command: ["python", "-m", "taskmesh.worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "taskmesh.liveness", "/tmp/worker-alive", "90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  scheduler:
    build: *app-build
    image: taskmesh/app:local
    environment:
      <<: *app-env
      SCHEDULER_HEALTH_FILE: /tmp/scheduler-alive
    command: ["python", "-m", "taskmesh.scheduler"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "taskmesh.liveness", "/tmp/scheduler-alive", "30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: taskmesh/frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
